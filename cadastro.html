<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Acessos — Empresa Fictícia S/A</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container-admin { max-width: 1200px; margin: 30px auto; display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        
        .panel {
            background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .light-mode .panel { background: rgba(255, 255, 255, 0.8); border-color: rgba(0, 0, 0, 0.1); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: #ccc; }
        .light-mode .form-group label { color: #555; }
        .form-control { width: 100%; padding: 10px; background: rgba(10, 10, 10, 0.8); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 6px; }
        .light-mode .form-control { background: #fff; color: #333; border-color: #ccc; }
        
        .btn { padding: 10px 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-primary { background: var(--lime); color: #000; }
        .btn-secondary { background: #555; color: #fff; }
        
        .table-users { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        .table-users th, .table-users td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .light-mode .table-users th, .light-mode .table-users td { border-bottom: 1px solid rgba(0,0,0,0.1); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .badge-admin { background: #ff4444; color: #fff; }
        .badge-operador { background: #0096FF; color: #fff; }
        .badge-leitura { background: #888; color: #fff; }
        .badge-default { background: #6c757d; color: #fff; }
        .badge-ativo { background: var(--lime); color: #000; }
        .badge-inativo { background: #333; color: #fff; }
        
        .btn-edit { background: transparent; border: 1px solid #0096FF; color: #0096FF; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
        .btn-edit:hover { background: #0096FF; color: #fff; }
    
    /* LAYOUT CORRECTIONS INJECTED */
    .main-content {
        margin-left: 250px !important;
        width: calc(100% - 250px) !important;
        box-sizing: border-box !important;
        overflow-x: hidden !important;
    }
    header, .dashboard-header, .app-header, .navbar {
        position: static !important;
        width: 100% !important;
        left: auto !important;
        margin-left: 0 !important;
    }

    </style>

    <!-- Injected Sidebar CSS -->
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background-color: #0f172a; /* Slate oscuro do tema mkdocs */
            color: #f1f5f9;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
            padding: 20px 0;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 10px;
        }
        .sidebar-header h2 {
            color: #f8fafc;
            font-size: 18px;
            margin: 0;
            font-weight: 700;
        }
        .sidebar ul, .sidebar-menu { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }
        .sidebar li a, .sidebar-menu a {
            display: block;
            padding: 15px 25px;
            color: #cbd5e1;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }
        .sidebar li a:hover, .sidebar li a.active, .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: #1e293b;
            color: #06b6d4; /* Cyan de destaque */
            border-left: 4px solid #06b6d4;
        }
    </style>
    <script src="js/sidebar.js" defer></script>
</head>
<body>

    <aside id="sidebar-root" class="sidebar"></aside>

<div class="main-content">


<div class="dash">
    <div class="header">
        <div class="header-left">
            <div class="brand-box" style="background: #ff4444; color: #fff;">SEC</div>
            <div>
                <h1>GESTÃO DE ACESSOS</h1>
                <p>Administração de Perfis e Permissões (RBAC)</p>
            </div>
        </div>
        <div class="header-right">
            <a href="index.html" class="btn-back" style="color: #fff; text-decoration: none; border: 1px solid #fff; padding: 8px 15px; border-radius: 6px;">⬅ Voltar</a>
        </div>
    </div>

    <div class="container-admin">
        <div class="panel fade-in">
            <h3 id="formTitle">Criar Novo Usuário</h3>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>E-mail Corporativo</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Nível de Acesso (Role)</label>
                    <select id="role" class="form-control" required>
                    </select>
                </div>
                <div class="form-group">
                    <label>Senha <span id="senhaHint" style="font-size: 0.8rem; font-weight: normal;"></span></label>
                    <input type="password" id="senha" class="form-control">
                </div>
                <div class="form-group" id="divStatus" style="display: none;">
                    <label>Status da Conta</label>
                    <select id="ativo" class="form-control">
                        <option value="true">Ativo</option>
                        <option value="false">Bloqueado</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar Usuário</button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()" style="display: none;" id="btnCancelar">Cancelar Edição</button>
            </form>
            <div id="msg" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </div>

        <div class="panel fade-in">
            <h3>Usuários Registados</h3>
            <table class="table-users">
                <thead>
                    <tr>
                        <th>ID</th><th>Nome</th><th>E-mail</th><th>Role</th><th>Status</th><th>Último Acesso</th><th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaBody">
                    <tr><td colspan="7" style="text-align: center;" class="stat-value">-</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>




    <!-- Script de Mock Injetado -->
    


    



    


    <!-- MOCK SCRIPT FINAL E DEFINITIVO: cadastro.html -->
    <script>
        function runFinalMock_cadastro() {
            try {
                // Arrays realistas para simular infraestrutura corporativa
                const servers = ['node-app-01', 'db-cluster-02', 'srv-web-03', 'cache-redis-alpha', 'worker-queue-05', 'proxy-nginx-edge'];
                const issues = ['High CPU Load', 'Deadlock Detected', 'Replication Lag', 'Memory Peak', 'Disk Space Low', 'Connection Timeout'];
                const ips = ['10.0.1.42', '10.0.2.15', '10.0.1.200', '192.168.1.5', '10.0.3.50'];
                const dags = ['etl_dados_core', 'relatorios_mensais', 'limpeza_cache', 'sync_vendas', 'backup_db'];
                const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
                
                // 1. CARDS E VALORES ISOLADOS (Incluindo cards ignorados com "-")
                const metricElements = document.querySelectorAll('.stat-value, [id*="cpu"], [id*="mem"], [id*="lag"], [id*="conn"], .metric, .value, [id*="aberto"], [id*="fechado"]');
                metricElements.forEach(el => {
                    const t = el.innerText || '';
                    const idClass = (el.id + ' ' + el.className).toLowerCase();
                    let hasPct = t.includes('%') || idClass.includes('pct') || idClass.includes('cpu') || idClass.includes('mem');
                    
                    if (idClass.includes('crit') || idClass.includes('erro') || idClass.includes('falha')) {
                        el.innerText = Math.floor(Math.random() * 3);
                    } else if (idClass.includes('lag')) {
                        el.innerText = Math.floor(Math.random() * 10) + 's';
                    } else if (idClass.includes('conn') || idClass.includes('conex') || t.length >= 4) {
                        el.innerText = Math.floor(Math.random() * 5000) + 1000;
                    } else if (idClass.includes('aberto') || idClass.includes('fechado') || idClass.includes('ticket')) {
                        el.innerText = Math.floor(Math.random() * 150) + 20;
                    } else {
                        el.innerText = Math.floor(Math.random() * (95 - 20) + 20) + (hasPct ? '%' : '');
                    }
                });

                // Resolve todos os cards travados com "-" soltos em spans, hs, divs, etc.
                document.querySelectorAll('span, p, div, h2, h3, h4').forEach(el => {
                    if (el.children.length === 0 && el.innerText.trim() === '-') {
                        el.innerText = Math.floor(Math.random() * 100);
                    }
                });

                // 2. TABELAS DE DADOS (Substituindo o antigo literal "Mock Data")
                const tbodies = document.querySelectorAll('tbody');
                tbodies.forEach((tb) => {
                    const txt = tb.innerText.trim().toLowerCase();
                    if (txt === '' || txt === '-' || txt.includes('nenhum') || txt.includes('erro') || txt.includes('carregando') || tb.children.length === 0 || txt.includes('node-app-01')) {
                        let rowsHTML = '';
                        let numRows = Math.floor(Math.random() * 3) + 3; // 3 a 5 linhas
                        for(let i=0; i<numRows; i++) {
                            if ('cadastro.html'.includes('invent')) {
                                rowsHTML += `<tr><td>${getRandom(servers)}</td><td>${getRandom(ips)}</td><td>${Math.floor(Math.random()*64)+8}GB</td><td>${Math.floor(Math.random()*2000)+100}GB</td><td><span class="badge status-ok">Online</span></td></tr>`;
                            } else if ('cadastro.html'.includes('airflow')) {
                                rowsHTML += `<tr><td>DAG_${getRandom(dags)}</td><td><span class="badge status-ok">SUCESSO</span></td><td>${Math.floor(Math.random()*50)+10}s</td><td>${new Date().toLocaleTimeString()}</td></tr>`;
                            } else if ('cadastro.html'.includes('ticket') || 'cadastro.html'.includes('redmine') || 'cadastro.html'.includes('bitrix')) {
                                rowsHTML += `<tr><td>#${Math.floor(Math.random()*9000)+1000}</td><td>${getRandom(issues)}</td><td>${getRandom(['Alta','Média','Baixa'])}</td><td>Aberto</td><td>${new Date().toLocaleDateString()}</td></tr>`;
                            } else {
                                rowsHTML += `<tr><td>${getRandom(servers)}</td><td>${getRandom(issues)}</td><td><span class="badge status-ok">OK</span></td><td>${Math.floor(Math.random()*100)}ms</td></tr>`;
                            }
                        }
                        tb.innerHTML = rowsHTML;
                    }
                });

                // 3. INJEÇÃO VISUAL DE GRÁFICOS (O PASSO CRÍTICO)
                // Remove todos os canvas do Chart.js que ficaram órfãos e os converte em divs para podermos injetar HTML
                document.querySelectorAll('canvas').forEach(canvas => {
                    let p = canvas.parentNode;
                    let div = document.createElement('div');
                    div.className = 'injected-chart-mock';
                    div.style.width = '100%';
                    div.style.padding = '10px 0';
                    p.replaceChild(div, canvas);
                });

                // Encontra os containers órfãos, sejam os divs injetados ou card de charts vazios
                const chartContainers = document.querySelectorAll('.chart-card, .chart-container, .injected-chart-mock, [id*="chart"], [class*="grafico"]');
                chartContainers.forEach(container => {
                    // Filtra para agir apenas nos divs corretos
                    if (container.classList.contains('injected-chart-mock') || container.children.length === 0 || (container.children.length === 1 && container.children[0].tagName.match(/H[1-6]/))) {
                        
                        let isUpdate = container.querySelector('.progress-bar-mock');
                        let htmlContent = '';
                        let numBars = Math.floor(Math.random() * 3) + 3; // 3 a 5 barras simulam gráficos perfeitamente
                        
                        for(let i=0; i<numBars; i++) {
                            let color = getRandom(['#06b6d4', '#4ade80', '#fbbf24', '#a855f7', '#f87171']);
                            let label = getRandom(['CPU Core', 'Disk I/O', 'Memory Usage', 'Network In', 'Queries/s']) + ' 0' + (i+1);
                            let width = Math.floor(Math.random() * 70) + 20; // 20% a 90%
                            htmlContent += `
                                <div style="margin-top:12px;" class="progress-bar-mock">
                                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                        <span style="color:#94a3b8; font-size:12px; font-family:sans-serif;">${label}</span>
                                        <span style="color:${color}; font-size:12px; font-weight:bold;">${width}%</span>
                                    </div>
                                    <div style="width: 100%; background:#1e293b; height:8px; border-radius:4px; overflow:hidden;">
                                        <div style="width: ${width}%; background:${color}; height:100%; transition: width 0.5s ease-in-out;"></div>
                                    </div>
                                </div>
                            `;
                        }
                        
                        // Renderização que preserva os títulos <h3> ou <h2>
                        if (isUpdate) {
                            let header = container.querySelector('h1, h2, h3, h4');
                            container.innerHTML = (header ? header.outerHTML : '') + htmlContent;
                        } else {
                            container.innerHTML += htmlContent;
                        }
                    }
                });

            } catch (error) {
                console.warn('Erro isolado no mock final:', error);
            }
        }
        
        runFinalMock_cadastro();
        setInterval(runFinalMock_cadastro, 5000);
    </script>

</body>
</html>
