<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário Físico — Centro de Comando</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Ajuste para ocupar a largura total sem a barra lateral */
        body {
            margin: 0;
            padding: 0;
        }

        .dash {
            padding: 20px 30px;
            max-width: 100%;
            box-sizing: border-box;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .full-width {
            grid-column: span 3;
        }

        @media (max-width: 1200px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }
        }

        /* Filtros refinados seguindo a identidade visual */
        .filters-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .filter-group input,
        .filter-group select {
            background: var(--bg4);
            border: 1px solid var(--border);
            color: var(--white);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: var(--lime);
            box-shadow: 0 0 8px var(--lime-glow, rgba(163, 230, 53, 0.2));
        }

        .btn-filter {
            background: var(--lime);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            height: 38px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-filter:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Status indicator styles */
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-ok {
            background: #00e076;
            box-shadow: 0 0 6px rgba(0, 224, 118, 0.4);
        }

        .status-bad {
            background: #ff5555;
            box-shadow: 0 0 6px rgba(255, 85, 85, 0.4);
        }

        /* Offcanvas Drawer Styles */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 650px;
            max-width: 100%;
            height: 100vh;
            background: var(--bg2);
            border-left: 1px solid var(--border);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 1001;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .drawer.active {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg3);
        }

        .drawer-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--lime);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drawer-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .drawer-close:hover {
            color: var(--white);
            transform: scale(1.1);
        }

        .drawer-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .drawer-meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .drawer-meta-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .drawer-meta-label {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .drawer-meta-value {
            font-size: 11px;
            color: var(--white);
            font-family: monospace;
            word-break: break-all;
        }

        .drawer-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .drawer-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .btn-view-diag {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--white);
            padding: 5px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-view-diag:hover {
            border-color: var(--lime);
            background: var(--bg4);
            color: var(--lime);
            transform: translateY(-1px);
        }

        .code-box {
            background: var(--bg4);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 10px;
            color: var(--white);
            white-space: pre-wrap;
            max-height: 250px;
            overflow-y: auto;
        }
    
    /* LAYOUT CORRECTIONS INJECTED */
    .main-content {
        margin-left: 250px !important;
        width: calc(100% - 250px) !important;
        box-sizing: border-box !important;
        overflow-x: hidden !important;
    }
    header, .dashboard-header, .app-header, .navbar {
        position: static !important;
        width: 100% !important;
        left: auto !important;
        margin-left: 0 !important;
    }

    </style>

    <!-- Injected Sidebar CSS -->
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background-color: #0f172a; /* Slate oscuro do tema mkdocs */
            color: #f1f5f9;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
            padding: 20px 0;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 10px;
        }
        .sidebar-header h2 {
            color: #f8fafc;
            font-size: 18px;
            margin: 0;
            font-weight: 700;
        }
        .sidebar ul, .sidebar-menu { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }
        .sidebar li a, .sidebar-menu a {
            display: block;
            padding: 15px 25px;
            color: #cbd5e1;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }
        .sidebar li a:hover, .sidebar li a.active, .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: #1e293b;
            color: #06b6d4; /* Cyan de destaque */
            border-left: 4px solid #06b6d4;
        }
    </style>
    <script src="js/sidebar.js" defer></script>
</head>

<body>

    <aside id="sidebar-root" class="sidebar"></aside>

<div class="main-content">


    <div class="dash">
        <div class="header">
            <div class="header-left">
                <div class="brand-box">Empresa Fictícia S/A</div>
                <div>
                    <h1>INVENTÁRIO FÍSICO</h1>
                    <p>Infraestrutura de Servidores • Ativos, Hardware, Discos e Licenciamento</p>
                </div>
            </div>
            <div class="header-right">
                <a href="index.html" class="btn-back">⬅ Voltar ao Portal</a>
            </div>
        </div>

        <div class="grid-container">
            <!-- SEÇÃO DE FILTROS COM DATALIST E STATUS -->
            <div class="cc full-width fade-in">
                <div class="ct">🔍 Filtros de Pesquisa</div>
                <div class="filters-container">
                    <div class="filter-group">
                        <label for="inputCliente">Cliente</label>
                        <input type="text" id="inputCliente" list="listClientes"
                            placeholder="Digite ou selecione o cliente...">
                        <datalist id="listClientes"></datalist>
                    </div>
                    <div class="filter-group">
                        <label for="inputHostname">Hostname / IP</label>
                        <input type="text" id="inputHostname" list="listHostnames"
                            placeholder="Digite ou selecione o host/IP...">
                        <datalist id="listHostnames"></datalist>
                    </div>
                    <div class="filter-group">
                        <label for="selectStatus">Status</label>
                        <select id="selectStatus">
                            <option value="">Todos</option>
                            <option value="0">Ativo</option>
                            <option value="1">Desativado</option>
                        </select>
                    </div>
                    <button class="btn-filter" onclick="loadInventory()">Filtrar</button>
                </div>
            </div>

            <!-- TABELA MACRO DE SERVIDORES -->
            <div class="cc full-width fade-in">
                <div class="ct">📋 Servidores Cadastrados</div>
                <div class="tbl-wrap" style="max-height: 550px;">
                    <table class="tbl">
                        <thead>
                            <tr>
                                <th style="width: 70px;">Status</th>
                                <th>Cliente</th>
                                <th>Site</th>
                                <th>Hostname / IP</th>
                                <th>Hardware (CPU / RAM)</th>
                                <th style="width: 120px; text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <tr>
                                <td colspan="6" style="text-align:center; padding:20px;">
                                    <span class="badge status-default" class="stat-value">-</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Offcanvas Drawer Component para Detalhes Enriquecidos sob Demanda -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="fecharDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h3 class="drawer-title" id="drawerTitle">🔍 Detalhes do Servidor</h3>
            <button class="drawer-close" onclick="fecharDrawer()">&times;</button>
        </div>
        <div class="drawer-body" id="drawerBody">
            <!-- Preenchido dinamicamente via JS sob demanda -->
        </div>
    </div>
</div>


    

    <!-- Script de Mock Injetado -->
    


    



    


    <!-- MOCK SCRIPT FINAL E DEFINITIVO: inventory.html -->
    <script>
        function runFinalMock_inventory() {
            try {
                // Arrays realistas para simular infraestrutura corporativa
                const servers = ['node-app-01', 'db-cluster-02', 'srv-web-03', 'cache-redis-alpha', 'worker-queue-05', 'proxy-nginx-edge'];
                const issues = ['High CPU Load', 'Deadlock Detected', 'Replication Lag', 'Memory Peak', 'Disk Space Low', 'Connection Timeout'];
                const ips = ['10.0.1.42', '10.0.2.15', '10.0.1.200', '192.168.1.5', '10.0.3.50'];
                const dags = ['etl_dados_core', 'relatorios_mensais', 'limpeza_cache', 'sync_vendas', 'backup_db'];
                const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
                
                // 1. CARDS E VALORES ISOLADOS (Incluindo cards ignorados com "-")
                const metricElements = document.querySelectorAll('.stat-value, [id*="cpu"], [id*="mem"], [id*="lag"], [id*="conn"], .metric, .value, [id*="aberto"], [id*="fechado"]');
                metricElements.forEach(el => {
                    const t = el.innerText || '';
                    const idClass = (el.id + ' ' + el.className).toLowerCase();
                    let hasPct = t.includes('%') || idClass.includes('pct') || idClass.includes('cpu') || idClass.includes('mem');
                    
                    if (idClass.includes('crit') || idClass.includes('erro') || idClass.includes('falha')) {
                        el.innerText = Math.floor(Math.random() * 3);
                    } else if (idClass.includes('lag')) {
                        el.innerText = Math.floor(Math.random() * 10) + 's';
                    } else if (idClass.includes('conn') || idClass.includes('conex') || t.length >= 4) {
                        el.innerText = Math.floor(Math.random() * 5000) + 1000;
                    } else if (idClass.includes('aberto') || idClass.includes('fechado') || idClass.includes('ticket')) {
                        el.innerText = Math.floor(Math.random() * 150) + 20;
                    } else {
                        el.innerText = Math.floor(Math.random() * (95 - 20) + 20) + (hasPct ? '%' : '');
                    }
                });

                // Resolve todos os cards travados com "-" soltos em spans, hs, divs, etc.
                document.querySelectorAll('span, p, div, h2, h3, h4').forEach(el => {
                    if (el.children.length === 0 && el.innerText.trim() === '-') {
                        el.innerText = Math.floor(Math.random() * 100);
                    }
                });

                // 2. TABELAS DE DADOS (Substituindo o antigo literal "Mock Data")
                const tbodies = document.querySelectorAll('tbody');
                tbodies.forEach((tb) => {
                    const txt = tb.innerText.trim().toLowerCase();
                    if (txt === '' || txt === '-' || txt.includes('nenhum') || txt.includes('erro') || txt.includes('carregando') || tb.children.length === 0 || txt.includes('node-app-01')) {
                        let rowsHTML = '';
                        let numRows = Math.floor(Math.random() * 3) + 3; // 3 a 5 linhas
                        for(let i=0; i<numRows; i++) {
                            if ('inventory.html'.includes('invent')) {
                                rowsHTML += `<tr><td>${getRandom(servers)}</td><td>${getRandom(ips)}</td><td>${Math.floor(Math.random()*64)+8}GB</td><td>${Math.floor(Math.random()*2000)+100}GB</td><td><span class="badge status-ok">Online</span></td></tr>`;
                            } else if ('inventory.html'.includes('airflow')) {
                                rowsHTML += `<tr><td>DAG_${getRandom(dags)}</td><td><span class="badge status-ok">SUCESSO</span></td><td>${Math.floor(Math.random()*50)+10}s</td><td>${new Date().toLocaleTimeString()}</td></tr>`;
                            } else if ('inventory.html'.includes('ticket') || 'inventory.html'.includes('redmine') || 'inventory.html'.includes('bitrix')) {
                                rowsHTML += `<tr><td>#${Math.floor(Math.random()*9000)+1000}</td><td>${getRandom(issues)}</td><td>${getRandom(['Alta','Média','Baixa'])}</td><td>Aberto</td><td>${new Date().toLocaleDateString()}</td></tr>`;
                            } else {
                                rowsHTML += `<tr><td>${getRandom(servers)}</td><td>${getRandom(issues)}</td><td><span class="badge status-ok">OK</span></td><td>${Math.floor(Math.random()*100)}ms</td></tr>`;
                            }
                        }
                        tb.innerHTML = rowsHTML;
                    }
                });

                // 3. INJEÇÃO VISUAL DE GRÁFICOS (O PASSO CRÍTICO)
                // Remove todos os canvas do Chart.js que ficaram órfãos e os converte em divs para podermos injetar HTML
                document.querySelectorAll('canvas').forEach(canvas => {
                    let p = canvas.parentNode;
                    let div = document.createElement('div');
                    div.className = 'injected-chart-mock';
                    div.style.width = '100%';
                    div.style.padding = '10px 0';
                    p.replaceChild(div, canvas);
                });

                // Encontra os containers órfãos, sejam os divs injetados ou card de charts vazios
                const chartContainers = document.querySelectorAll('.chart-card, .chart-container, .injected-chart-mock, [id*="chart"], [class*="grafico"]');
                chartContainers.forEach(container => {
                    // Filtra para agir apenas nos divs corretos
                    if (container.classList.contains('injected-chart-mock') || container.children.length === 0 || (container.children.length === 1 && container.children[0].tagName.match(/H[1-6]/))) {
                        
                        let isUpdate = container.querySelector('.progress-bar-mock');
                        let htmlContent = '';
                        let numBars = Math.floor(Math.random() * 3) + 3; // 3 a 5 barras simulam gráficos perfeitamente
                        
                        for(let i=0; i<numBars; i++) {
                            let color = getRandom(['#06b6d4', '#4ade80', '#fbbf24', '#a855f7', '#f87171']);
                            let label = getRandom(['CPU Core', 'Disk I/O', 'Memory Usage', 'Network In', 'Queries/s']) + ' 0' + (i+1);
                            let width = Math.floor(Math.random() * 70) + 20; // 20% a 90%
                            htmlContent += `
                                <div style="margin-top:12px;" class="progress-bar-mock">
                                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                        <span style="color:#94a3b8; font-size:12px; font-family:sans-serif;">${label}</span>
                                        <span style="color:${color}; font-size:12px; font-weight:bold;">${width}%</span>
                                    </div>
                                    <div style="width: 100%; background:#1e293b; height:8px; border-radius:4px; overflow:hidden;">
                                        <div style="width: ${width}%; background:${color}; height:100%; transition: width 0.5s ease-in-out;"></div>
                                    </div>
                                </div>
                            `;
                        }
                        
                        // Renderização que preserva os títulos <h3> ou <h2>
                        if (isUpdate) {
                            let header = container.querySelector('h1, h2, h3, h4');
                            container.innerHTML = (header ? header.outerHTML : '') + htmlContent;
                        } else {
                            container.innerHTML += htmlContent;
                        }
                    }
                });

            } catch (error) {
                console.warn('Erro isolado no mock final:', error);
            }
        }
        
        runFinalMock_inventory();
        setInterval(runFinalMock_inventory, 5000);
    </script>

</body>

</html>
